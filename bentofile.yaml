service: "src.service:AdmissionService"
name: admission_prediction_service
description: "Admission prediction service with JWT authentication"
labels:
  owner: "DataScientest"
  project: "admissions_prediction"
include:
  - "src/"
exclude:
  - "**/__pycache__/"
models:
  - admission_lr:latest
python:
  packages:
    - bentoml==1.4.35
    - scikit-learn==1.3.2
    - pandas==2.3.3
    - numpy==1.26.4
    - "pydantic>=2.12.2,<2.13"
    - pyjwt==2.10.1
docker:
  python_version: "3.10"